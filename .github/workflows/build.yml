name: Build iOS TIPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip git
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mkdir -p $HOME/theos/sdks
          cp -r sdks-master/* $HOME/theos/sdks/
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xyris_FF_Custom_TIPA
          path: packages/*.tipa
