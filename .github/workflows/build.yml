name: Build iOS TIPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: theos/setup-theos@v1
        with:
          theos-src: theos/theos
          theos-sdks: theos/sdks

      - name: Build TIPA Package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xyris_FF_Custom_TIPA
          path: packages/*.tipa
