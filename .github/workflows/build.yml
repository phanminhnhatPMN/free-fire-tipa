name: Build iOS TIPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mkdir -p $HOME/theos/sdks
          cp -r sdks-master/* $HOME/theos/sdks/
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build TIPA Package
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1
          mkdir -p packages Payload
          cp -r .theos/_/Applications/Xyris.app Payload/
          zip -qr packages/Xyris_Custom.tipa Payload

      - name: Upload TIPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xyris_FF_Custom_TIPA
          path: packages/Xyris_Custom.tipa
